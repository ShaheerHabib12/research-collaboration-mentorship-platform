name: User story or task
description: Planned work linked to the requirements
labels: []
body:
  - type: input
    id: requirements
    attributes:
      label: Requirement IDs
      description: UR, FR, NFR and UC identifiers from the report
      placeholder: "UR-002, FR-007, UC-01"
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: Description
      placeholder: "As a <role>, I want <goal> so that <benefit>."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- Valid input is saved ...\n- Invalid input shows ..."
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority (MoSCoW)
      options: [Must, Should, Could, Won't]
    validations:
      required: true
